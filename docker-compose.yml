services:
  app:
    build: .
    expose:
      - "5000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped
