name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate


  test:
    name: Build and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=portfolio
          POSTGRES_USER=portfolio_user
          POSTGRES_PASSWORD=ci_test_password
          EOF

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build and start services
        run: docker compose up -d --build

      - name: Show service status
        run: docker compose ps

      - name: Wait for application
        run: |
          curl --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            http://localhost/health

      - name: Test database health
        run: curl --fail http://localhost/db-health

      - name: Test application database writes
        run: |
          RESPONSE1=$(curl --fail --silent http://localhost/visits)
          echo "$RESPONSE1"
          echo "$RESPONSE1" | grep '"total_visits":1'

          RESPONSE2=$(curl --fail --silent http://localhost/visits)
          echo "$RESPONSE2"
          echo "$RESPONSE2" | grep '"total_visits":2'

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v


  deploy:
    name: Deploy to AWS EC2

    needs:
      - terraform
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::563807597162:role/github-actions-aws-docker-webapp-role
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through AWS Systems Manager
        id: deploy
        shell: bash
        run: |
          cat > ssm-params.json <<'EOF'
          {
            "commands": [
              "set -e",
              "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/aws-docker-webapp && git fetch origin main && git reset --hard origin/main && docker compose up -d --build'",
              "cd /home/ubuntu/aws-docker-webapp && docker compose ps",
              "curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost/health",
              "curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost/db-health"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0a0237040d26ffde4" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deployment ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for ATTEMPT in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0a0237040d26ffde4" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Attempt $ATTEMPT - Status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-0a0237040d26ffde4" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-0a0237040d26ffde4" \
                  --query "StandardOutputContent" \
                  --output text || true

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-0a0237040d26ffde4" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment."
          exit 1
